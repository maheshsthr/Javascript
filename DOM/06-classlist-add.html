<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .active{
            color: green;
        }
    </style>
    <h1>On/Off</h1>
</body>
<script>
    const element = document.querySelector("h1")
    element.classList.add("active")
    element.textContent ="DOM Active Heading"
</script>
</html>
